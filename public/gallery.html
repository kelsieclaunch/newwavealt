<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Wave Alternative | Gallery</title>

    <link rel="icon" type="image/png" href="assets/cd2.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;400&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="submark">
            <a href="index.html">
                <img src="assets/submark.png" alt="New Wave Alternative Submark">
            </a>
        </div>

        <ul>
            <li><a href="gallery.html">GALLERY</a></li>
            <li><a href="index.html#submit">SUBMIT</a></li>
        </ul>
    </nav>


    <!-- HEADER -->
    <header class="header-section">

        <img
            src="assets/crowd3.png"
            alt="Concert crowd"
            class="header-bg"
        >

        <div class="header-content">

            <div class="gallery-logo">
                <h1><strong>GALLERY</strong></h1>
            </div>

            <p class="mission-statement">
                HIGHLIGHTING PHENOMENAL ARTISTS
                <br>
                SHOT BY PHENOMENAL PHOTOGRAPHERS
            </p>

        </div>

    </header>


    <!-- HEADER TRIM -->
    <div class="header-trim">
        <img src="assets/trim.png" alt="Checkerboard trim">
    </div>


    <!-- DYNAMIC GALLERY -->
    <main class="gallery">

        <div id="galleryPreview" class="gallery-grid">
            <!-- Gallery images will be inserted dynamically -->
        </div>

    </main>


    <!-- FOOTER TRIM -->
    <div class="header-trim">
        <img src="assets/trim.png" alt="Checkerboard trim">
    </div>


    <!-- FOOTER -->
    <footer class="footer-pattern">

        <div class="footer-content">

            <a href="/privacy_policy.html" class="footer-link">
                PRIVACY POLICY
            </a>

            <div class="footer-icons">

                <a
                    href="https://www.instagram.com/newwavealt/"
                    class="instagram"
                    aria-label="Instagram"
                >
                    <img src="/assets/instagram.webp" alt="">
                </a>

                <a
                    href="https://www.tiktok.com/@newwavealt"
                    class="tiktok"
                    aria-label="TikTok"
                >
                    <img src="/assets/tiktok.webp" alt="">
                </a>

                <a
                    href="https://open.spotify.com/user/315lvdcq4vmen47macpalph6qbka?si=1c2221f19a3649f5"
                    class="spotify"
                    aria-label="Spotify"
                >
                    <img src="/assets/spotify.png" alt="">
                </a>

            </div>

        </div>

    </footer>


    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">

        <span class="lightbox-close" id="lightboxClose">&times;</span>

        <button class="lightbox-arrow left" id="lightboxPrev">
            &#10094;
        </button>

        <button class="lightbox-arrow right" id="lightboxNext">
            &#10095;
        </button>

        <img class="lightbox-img" id="lightboxImg" src="" alt="">

        <div class="lightbox-caption" id="lightboxCaption">
            <a
                id="lightboxCaptionLink"
                target="_blank"
                rel="noopener noreferrer"
            ></a>
        </div>

    </div>


    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Shared Supabase configuration -->
    <script src="/admin/supabase.js"></script>

    <!-- Dynamic gallery and lightbox functionality -->
    <script src="gallery.js"></script>

</body>
</html>
